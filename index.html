<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Буфер</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; background: #111; color: #eee; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #1c1c1c; border-bottom: 1px solid #333; font-size: 14px; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; transition: background .25s; }
  header .dot.ok { background: #2ecc71; }
  header .dot.err { background: #e74c3c; }
  header .dot.busy { background: #f1c40f; }
  header .spacer { flex: 1; }
  header button { background: #2d2d2d; color: #eee; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  header button:active { background: #3d3d3d; }
  textarea { flex: 1; width: 100%; resize: none; border: none; outline: none; padding: 14px; font-size: 17px; line-height: 1.4; background: #181818; color: #eee; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .info { font-size: 12px; opacity: .6; }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <span id="status">подключение…</span>
  <span class="info" id="info"></span>
  <span class="spacer"></span>
  <button id="copy">Копировать</button>
  <button id="clear">Очистить</button>
</header>
<textarea id="t" placeholder="Пиши тут — на втором устройстве появится через ~1 сек"></textarea>
<script>
  // Уникальный топик — кто знает имя, тот видит текст.
  const TOPIC = "clpbd-kim-a7f3e2d8b1c9k4m7";
  const POST_URL = "https://ntfy.sh/" + TOPIC;
  const POLL_URL = "https://ntfy.sh/" + TOPIC + "/json?poll=1";

  const t = document.getElementById("t");
  const dot = document.getElementById("dot");
  const status = document.getElementById("status");
  const info = document.getElementById("info");

  let lastApplied = "";      // последнее значение, синхронизированное с сервером (что мы видели или отправили)
  let pushTimer = null;      // debounce-таймер для записи
  let pushing = false;
  let userTypingUntil = 0;

  function setDot(cls, msg) {
    dot.className = "dot " + cls;
    if (msg) status.textContent = msg;
  }

  // Сообщение в ntfy = JSON: {"v": "текст"} (так умеем хранить пустую строку)
  function encode(text) { return JSON.stringify({ v: text }); }
  function decode(s) {
    try { const j = JSON.parse(s); if (j && typeof j.v === "string") return j.v; } catch {}
    return null;
  }

  async function pull() {
    if (pushing) return;
    if (Date.now() < userTypingUntil) return;
    try {
      const r = await fetch(POLL_URL, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const txt = await r.text();
      const lines = txt.split("\n").map(s => s.trim()).filter(Boolean);
      // берём последнее декодируемое сообщение
      let latest = null;
      for (let i = lines.length - 1; i >= 0; i--) {
        try {
          const msg = JSON.parse(lines[i]);
          if (msg && msg.event === "message" && typeof msg.message === "string") {
            const v = decode(msg.message);
            if (v !== null) { latest = v; break; }
          }
        } catch {}
      }
      if (latest !== null && latest !== lastApplied) {
        lastApplied = latest;
        if (t.value !== latest) t.value = latest;
      }
      setDot("ok", "синхронизировано");
      info.textContent = new Date().toLocaleTimeString();
    } catch (e) {
      setDot("err", "ошибка чтения");
    }
  }

  async function pushNow() {
    if (pushing) return;
    const payload = t.value;
    if (payload === lastApplied) return;
    pushing = true;
    setDot("busy", "сохранение…");
    try {
      const r = await fetch(POST_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: encode(payload)
      });
      if (!r.ok) throw new Error(r.status);
      lastApplied = payload;
      setDot("ok", "сохранено");
      info.textContent = new Date().toLocaleTimeString();
    } catch (e) {
      setDot("err", "ошибка записи");
    } finally {
      pushing = false;
    }
  }

  function schedulePush() {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushNow, 600); // debounce 600мс после последнего ввода
  }

  t.addEventListener("input", () => {
    userTypingUntil = Date.now() + 1500;
    setDot("busy", "печатает…");
    schedulePush();
  });

  document.getElementById("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(t.value);
      setDot("ok", "скопировано в буфер");
    } catch {
      t.select(); document.execCommand("copy");
      setDot("ok", "скопировано");
    }
  });

  document.getElementById("clear").addEventListener("click", () => {
    if (!confirm("Очистить текст на обоих устройствах?")) return;
    t.value = "";
    pushNow();
  });

  // Перед закрытием попытаемся успеть отправить последнее
  window.addEventListener("beforeunload", () => { if (t.value !== lastApplied) navigator.sendBeacon(POST_URL, encode(t.value)); });

  setInterval(pull, 1500);
  pull();
</script>
</body>
</html>
