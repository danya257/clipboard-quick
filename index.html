<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Буфер</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; background: #111; color: #eee; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #1c1c1c; border-bottom: 1px solid #333; font-size: 14px; flex-wrap: wrap; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; transition: background .25s; }
  header .dot.ok { background: #2ecc71; }
  header .dot.err { background: #e74c3c; }
  header .dot.busy { background: #f1c40f; }
  header .spacer { flex: 1; }
  header button, header label.btn { background: #2d2d2d; color: #eee; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; display: inline-block; }
  header button:hover, header label.btn:hover { background: #3a3a3a; }
  header button:disabled { opacity: .4; cursor: not-allowed; }
  textarea { flex: 1 1 40%; width: 100%; resize: none; border: none; outline: none; padding: 14px; font-size: 17px; line-height: 1.4; background: #181818; color: #eee; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; min-height: 100px; }
  .info { font-size: 12px; opacity: .6; }

  #photoBox { border-top: 1px solid #333; background: #141414; display: flex; flex-direction: column; min-height: 200px; max-height: 60vh; }
  #photoBar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; font-size: 13px; flex-wrap: wrap; border-bottom: 1px solid #262626; }
  #photoBar .spacer { flex: 1; }
  #photoBar button { background: #2d2d2d; color: #eee; border: 1px solid #444; padding: 5px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  #photoBar button:hover { background: #3a3a3a; }
  #photoBar button:disabled { opacity: .4; cursor: not-allowed; }

  #grid { flex: 1; overflow: auto; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; align-content: start; }
  #grid .empty { grid-column: 1 / -1; opacity: .4; font-size: 13px; text-align: center; padding: 30px 0; }
  .card { background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .card .imgwrap { aspect-ratio: 1 / 1; background: #0d0d0d; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
  .card .imgwrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .row { display: flex; gap: 4px; padding: 6px; }
  .card .row button { flex: 1; background: #2a2a2a; color: #eee; border: 1px solid #3a3a3a; border-radius: 4px; font-size: 11px; padding: 4px 2px; cursor: pointer; }
  .card .row button:hover { background: #3a3a3a; }
  .card .row .del { color: #ff7070; }
  .card .row .del:hover { background: #5a2020; }

  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 100; flex-direction: column; padding: 20px; }
  #lightbox.on { display: flex; }
  #lightbox img { max-width: 100%; max-height: calc(100% - 60px); object-fit: contain; }
  #lightbox .lbbar { display: flex; gap: 10px; margin-top: 14px; }
  #lightbox button { background: #2d2d2d; color: #eee; border: 1px solid #444; padding: 8px 14px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  #lightbox button:hover { background: #3a3a3a; }

  #fileIn { display: none; }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <span id="status">подключение…</span>
  <span class="info" id="info"></span>
  <span class="spacer"></span>
  <label class="btn" for="fileIn">Загрузить фото</label>
  <input type="file" id="fileIn" accept="image/*" multiple />
  <button id="copy">Копировать текст</button>
  <button id="clearText">Очистить текст</button>
  <button id="clearAllPhotos">Удалить все фото</button>
</header>

<textarea id="t" placeholder="Пиши тут — на втором устройстве появится через ~1 сек"></textarea>

<div id="photoBox">
  <div id="photoBar">
    <span id="photoStatus" class="info">фото нет</span>
    <span class="spacer"></span>
    <span class="info">Перетащи файлы или Ctrl+V из буфера</span>
  </div>
  <div id="grid"><div class="empty">фото нет — нажми «Загрузить фото» (можно несколько за раз)</div></div>
</div>

<div id="lightbox">
  <img id="lbImg" alt="" />
  <div class="lbbar">
    <button id="lbCopy">Копировать в буфер</button>
    <button id="lbDownload">Скачать</button>
    <button id="lbOpen">Открыть</button>
    <button id="lbClose">Закрыть</button>
  </div>
</div>

<script>
  const TOPIC = "clpbd-kim-a7f3e2d8b1c9k4m7";
  const POST_URL = "https://ntfy.sh/" + TOPIC;
  const POLL_URL = "https://ntfy.sh/" + TOPIC + "/json?poll=1";

  const t = document.getElementById("t");
  const dot = document.getElementById("dot");
  const status = document.getElementById("status");
  const info = document.getElementById("info");
  const fileIn = document.getElementById("fileIn");
  const grid = document.getElementById("grid");
  const photoStatus = document.getElementById("photoStatus");

  // Состояние
  let lastTextApplied = "";
  let pushTimer = null;
  let pushing = false;
  let uploading = false;
  let userTypingUntil = 0;
  // Текущий список фото: [{ time, url, name }] в порядке от новых к старым
  let currentPhotos = [];

  function setDot(cls, msg) {
    dot.className = "dot " + cls;
    if (msg) status.textContent = msg;
  }

  // Текст: {v: "..."}; tombstone для всех фото: {photo_clear: true}; tombstone для одного: {photo_delete: <ntfy_time>}
  function encodeJson(o) { return JSON.stringify(o); }
  function parseBody(s) { try { return JSON.parse(s); } catch { return null; } }

  async function pull() {
    if (pushing || uploading) return;
    if (Date.now() < userTypingUntil) return;
    try {
      const r = await fetch(POLL_URL, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const txt = await r.text();
      const lines = txt.split("\n").map(s => s.trim()).filter(Boolean);

      let latestText = null;
      let photoClearTs = -Infinity; // фото с time <= этой отметки игнорируем
      const deadTimes = new Set();  // конкретные удалённые фото
      const photos = [];            // [{time, url, name}] — новые сначала

      for (let i = lines.length - 1; i >= 0; i--) {
        let msg;
        try { msg = JSON.parse(lines[i]); } catch { continue; }
        if (!msg || msg.event !== "message") continue;

        // tombstones (читаем body как JSON)
        if (typeof msg.message === "string") {
          const j = parseBody(msg.message);
          if (j && j.photo_clear === true) {
            if (msg.time > photoClearTs) photoClearTs = msg.time;
            continue;
          }
          if (j && typeof j.photo_delete === "number") {
            deadTimes.add(j.photo_delete);
            continue;
          }
          if (j && typeof j.v === "string") {
            if (latestText === null) latestText = j.v;
            continue;
          }
        }

        // attachment = фото
        if (msg.attachment && msg.attachment.url) {
          if (msg.time > photoClearTs && !deadTimes.has(msg.time)) {
            photos.push({
              time: msg.time,
              url: msg.attachment.url,
              name: msg.attachment.name || "photo.jpg"
            });
          }
        }
      }

      // Применяем текст
      if (latestText !== null && latestText !== lastTextApplied) {
        lastTextApplied = latestText;
        if (t.value !== latestText) t.value = latestText;
      }

      // Применяем фото (рендерим только если изменилось)
      const sig = photos.map(p => p.time).join(",");
      if (sig !== currentPhotos.map(p => p.time).join(",")) {
        currentPhotos = photos;
        renderGrid();
      }

      setDot("ok", "синхронизировано");
      info.textContent = new Date().toLocaleTimeString();
    } catch (e) {
      setDot("err", "ошибка чтения");
    }
  }

  function renderGrid() {
    grid.innerHTML = "";
    if (currentPhotos.length === 0) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "фото нет — нажми «Загрузить фото» (можно несколько за раз)";
      grid.appendChild(e);
      photoStatus.textContent = "фото нет";
      return;
    }
    photoStatus.textContent = "фото: " + currentPhotos.length;
    for (const p of currentPhotos) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="imgwrap"><img loading="lazy" src="${p.url}" alt=""></div>
        <div class="row">
          <button data-act="copy">Копир.</button>
          <button data-act="dl">Скач.</button>
          <button data-act="open">Откр.</button>
          <button data-act="del" class="del">×</button>
        </div>`;
      card.querySelector(".imgwrap").addEventListener("click", () => openLightbox(p));
      card.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => handleCardAction(btn.dataset.act, p));
      });
      grid.appendChild(card);
    }
  }

  async function handleCardAction(act, p) {
    if (act === "open") { window.open(p.url, "_blank"); return; }
    if (act === "dl") {
      const a = document.createElement("a");
      a.href = p.url; a.download = p.name; a.target = "_blank";
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    if (act === "copy") { await copyImageToClipboard(p.url); return; }
    if (act === "del") {
      if (!confirm("Удалить это фото на обоих устройствах?")) return;
      await postTombstone({ photo_delete: p.time });
      // оптимистично прячем
      currentPhotos = currentPhotos.filter(x => x.time !== p.time);
      renderGrid();
    }
  }

  async function copyImageToClipboard(url) {
    try {
      const r = await fetch(url);
      const blob = await r.blob();
      const im = await new Promise((resolve, reject) => {
        const i = new Image(); i.crossOrigin = "anonymous";
        i.onload = () => resolve(i); i.onerror = reject;
        i.src = URL.createObjectURL(blob);
      });
      const cv = document.createElement("canvas");
      cv.width = im.naturalWidth; cv.height = im.naturalHeight;
      cv.getContext("2d").drawImage(im, 0, 0);
      const pngBlob = await new Promise(res => cv.toBlob(res, "image/png"));
      await navigator.clipboard.write([new ClipboardItem({ "image/png": pngBlob })]);
      setDot("ok", "фото в буфере");
    } catch (e) {
      setDot("err", "не удалось скопировать — используй «Открыть» → правый клик");
    }
  }

  async function postTombstone(obj) {
    try {
      const r = await fetch(POST_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: encodeJson(obj)
      });
      if (!r.ok) throw new Error(r.status);
    } catch (e) {
      setDot("err", "ошибка удаления");
    }
  }

  // Текст
  async function pushText() {
    if (pushing) return;
    const payload = t.value;
    if (payload === lastTextApplied) return;
    pushing = true;
    setDot("busy", "сохранение…");
    try {
      const r = await fetch(POST_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: encodeJson({ v: payload })
      });
      if (!r.ok) throw new Error(r.status);
      lastTextApplied = payload;
      setDot("ok", "сохранено");
      info.textContent = new Date().toLocaleTimeString();
    } catch (e) {
      setDot("err", "ошибка записи");
    } finally {
      pushing = false;
    }
  }
  function scheduleTextPush() {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushText, 600);
  }

  // Сжатие
  async function compressImage(file) {
    const MAX_DIM = 1600, QUALITY = 0.82;
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im); im.onerror = rej;
      im.src = URL.createObjectURL(file);
    });
    const scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(img.src);
    return await new Promise(res => canvas.toBlob(res, "image/jpeg", QUALITY));
  }

  // Загрузка одного файла → возвращает true/false
  async function uploadOne(file) {
    let body = file;
    let filename = file.name || "photo.jpg";
    if (file.type.startsWith("image/") && file.size > 200 * 1024) {
      body = await compressImage(file);
      filename = (filename.replace(/\.[^.]+$/, "")) + ".jpg";
    }
    if (!body) throw new Error("сжатие не удалось");
    const sizeKb = Math.round(body.size / 1024);
    if (body.size > 2 * 1024 * 1024) throw new Error(filename + ": " + sizeKb + " КБ > 2048");
    const r = await fetch(POST_URL, {
      method: "PUT",
      headers: {
        "Content-Type": body.type || "application/octet-stream",
        "Filename": filename
      },
      body
    });
    if (!r.ok) throw new Error(filename + ": HTTP " + r.status);
    return true;
  }

  // Очередь нескольких файлов
  async function uploadFiles(files) {
    if (!files || files.length === 0) return;
    if (uploading) return;
    uploading = true;
    const arr = Array.from(files);
    let done = 0, fail = 0;
    for (const f of arr) {
      done++;
      setDot("busy", "загрузка " + done + "/" + arr.length + "…");
      photoStatus.textContent = "загрузка " + done + "/" + arr.length + "…";
      try { await uploadOne(f); }
      catch (e) {
        fail++;
        console.error(e);
        setDot("err", e.message || String(e));
      }
    }
    uploading = false;
    fileIn.value = "";
    if (fail === 0) setDot("ok", "загружено " + done);
    else setDot("err", "ошибок: " + fail + " из " + arr.length);
    info.textContent = new Date().toLocaleTimeString();
    // Поллинг сам подтянет новые фото
    pull();
  }

  // События
  t.addEventListener("input", () => {
    userTypingUntil = Date.now() + 1500;
    setDot("busy", "печатает…");
    scheduleTextPush();
  });

  document.getElementById("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(t.value); setDot("ok", "текст в буфере"); }
    catch { t.select(); document.execCommand("copy"); setDot("ok", "скопировано"); }
  });

  document.getElementById("clearText").addEventListener("click", () => {
    if (!confirm("Очистить текст на обоих устройствах?")) return;
    t.value = "";
    pushText();
  });

  document.getElementById("clearAllPhotos").addEventListener("click", async () => {
    if (currentPhotos.length === 0) { setDot("ok", "фото и так нет"); return; }
    if (!confirm("Удалить ВСЕ фото на обоих устройствах? (" + currentPhotos.length + " шт)")) return;
    await postTombstone({ photo_clear: true });
    currentPhotos = [];
    renderGrid();
    setDot("ok", "фото удалены");
  });

  fileIn.addEventListener("change", () => { uploadFiles(fileIn.files); });

  document.addEventListener("dragover", e => { e.preventDefault(); });
  document.addEventListener("drop", e => {
    e.preventDefault();
    const files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) {
      const imgs = Array.from(files).filter(f => f.type.startsWith("image/"));
      if (imgs.length) uploadFiles(imgs);
    }
  });

  document.addEventListener("paste", e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    const imgs = [];
    for (const it of items) {
      if (it.kind === "file" && it.type.startsWith("image/")) {
        const f = it.getAsFile();
        if (f) imgs.push(f);
      }
    }
    if (imgs.length) { e.preventDefault(); uploadFiles(imgs); }
  });

  // Lightbox
  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lbImg");
  let lbPhoto = null;
  function openLightbox(p) {
    lbPhoto = p;
    lbImg.src = p.url;
    lb.classList.add("on");
  }
  function closeLightbox() { lb.classList.remove("on"); lbImg.src = ""; lbPhoto = null; }
  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && lb.classList.contains("on")) closeLightbox(); });
  document.getElementById("lbCopy").addEventListener("click", () => { if (lbPhoto) copyImageToClipboard(lbPhoto.url); });
  document.getElementById("lbDownload").addEventListener("click", () => {
    if (!lbPhoto) return;
    const a = document.createElement("a");
    a.href = lbPhoto.url; a.download = lbPhoto.name; a.target = "_blank";
    document.body.appendChild(a); a.click(); a.remove();
  });
  document.getElementById("lbOpen").addEventListener("click", () => { if (lbPhoto) window.open(lbPhoto.url, "_blank"); });

  window.addEventListener("beforeunload", () => {
    if (t.value !== lastTextApplied) navigator.sendBeacon(POST_URL, encodeJson({ v: t.value }));
  });

  setInterval(pull, 1500);
  pull();
</script>
</body>
</html>
